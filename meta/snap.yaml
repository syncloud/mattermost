apps:
  postgresql:
    user: mattermost
    command: bin/service.postgresql.sh
    daemon: forking
    plugs:
      - network
      - network-bind
    restart-condition: always
    restart-delay: 10s

  mattermost:
    user: mattermost
    command: bin/service.mattermost.sh
    daemon: simple
    plugs:
      - network
      - network-bind
    restart-condition: always
    restart-delay: 10s

  psql:
    command: bin/psql.sh

  pgdumpall:
    command: bin/pg_dumpall.sh

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start

confinement: strict
description: Online chat service with file sharing, search, and third party application integrations
grade: stable
name: mattermost
summary: Mattermost
